[project]
name = "gpt-model"
version = "0.1.0"
description = "Tiny GPT decoder (6 layers, 6 heads, 384 dim) written in raw PyTorch - ai-stack Phase 2"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gpt_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
